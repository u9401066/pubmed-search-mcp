name: CI

on:
  push:
    branches:
      - master
      - main
      - release/**
  pull_request:
  workflow_dispatch:
    inputs:
      run_extended_checks:
        description: Run the full compatibility matrix, Mermaid rendering, and container smoke
        required: false
        default: false
        type: boolean
      run_live_integrations:
        description: Run opt-in external API integration probes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mermaid-rendering:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_checks }}
    name: Mermaid parse and SVG rendering
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"

      - name: Sync dependencies
        run: uv sync --frozen --dev --python 3.11

      - name: Install pinned Mermaid rendering dependencies
        shell: bash
        run: |
          validator_root="$RUNNER_TEMP/pubmed-mermaid-validator"
          mkdir -p "$validator_root"
          npm install --prefix "$validator_root" --no-save --no-package-lock \
            --ignore-scripts --no-audit --fund=false \
            mermaid@11.16.1 jsdom@26.1.0

      - name: Parse Mermaid and render SVG
        shell: bash
        env:
          MERMAID_NODE_MODULES: ${{ runner.temp }}/pubmed-mermaid-validator/node_modules
        run: |
          fixture_directory="$RUNNER_TEMP/pubmed-mermaid-fixtures"
          PYTHONPATH=src python3 -S scripts/export_mermaid_smoke_fixtures.py "$fixture_directory"
          node scripts/check_mermaid_rendering.mjs \
            docs \
            ARCHITECTURE.md \
            CHANGELOG.md \
            DEPLOYMENT.md \
            ROADMAP.md \
             copilot-studio/README.md \
             "$fixture_directory"

      - name: Render Mermaid returned by the real MCP protocol
        env:
          MCP_ACCEPTANCE_REQUIRE_MERMAID_RENDER: "1"
          MERMAID_NODE_MODULES: ${{ runner.temp }}/pubmed-mermaid-validator/node_modules
        run: |
          uv run pytest -q \
            tests/test_all_tools_mcp_acceptance.py::test_all_tools_through_real_stdio_mcp

  quality-and-package:
    name: Public contracts, docs, and wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen --dev --python 3.13

      # Full validation belongs to the local pre-push gate. Keep an independent
      # clean-environment public-contract check for bypassed hooks and packaging.
      # The smoke profile already includes the fresh-wheel acceptance test once.
      - name: Shared smoke gate
        run: uv run --frozen python scripts/check_repo.py smoke

  test-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_checks }}
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --dev --python ${{ matrix.python-version }}

      - name: Pytest
        run: uv run pytest -q -m "not integration and not slow"

  container-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_checks }}
    name: Container build and entrypoint smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build pinned non-root image
        run: docker build --tag pubmed-search-mcp:ci .

      - name: Smoke packaged HTTP entrypoint
        run: docker run --rm pubmed-search-mcp:ci uv run --no-sync pubmed-search-mcp-http --help

  live-integrations:
    name: External API integration probes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_integrations }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBMED_RUN_LIVE_TESTS: "1"
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL || 'pubmed-search@example.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen --dev --python 3.13

      - name: Run live integration probes
        run: uv run pytest -q -m integration -rs
