name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, tests, and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync locked dependencies
        run: uv sync --frozen --dev --python 3.13

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_text = Path("src/pubmed_search/__init__.py").read_text(encoding="utf-8")
          init_version = re.search(r'^__version__\s*=\s*"([^"]+)"', init_text, re.MULTILINE)
          expected_tag = f"v{package_version}"
          if init_version is None or init_version.group(1) != package_version:
              raise SystemExit("pyproject.toml and package __version__ differ")
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']!r} must equal {expected_tag!r}")
          PY

      - name: Quality and documentation gates
        run: |
          uv run ruff check src/ tests/ scripts/ run_server.py run_copilot.py
          uv run ruff format --check src/ tests/ scripts/ run_server.py run_copilot.py
          uv run python scripts/check_async_tests.py
          uv run mypy src/ tests/
          uv run pytest -q -m "not integration"

      - name: Build distributions
        run: uv build

      - name: Install and smoke-test wheel
        run: |
          uv venv --python 3.13 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -c "import pubmed_search; from pubmed_search.api import PubMedSearchClient"
          .wheel-smoke/bin/pubmed-search-mcp-http --help

      - name: Build and smoke-test container image
        run: |
          docker build --tag pubmed-search-mcp:release .
          docker run --rm pubmed-search-mcp:release uv run --no-sync pubmed-search-mcp-http --help

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Publish verified GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --latest
          fi
