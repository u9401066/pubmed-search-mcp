# PubMed Search MCP Server - HTTPS Deployment
# Uses Nginx reverse proxy for TLS termination

services:
  # ==========================================================================
  # Nginx Reverse Proxy (HTTPS)
  # ==========================================================================
  nginx:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports:
      - "127.0.0.1:443:443"      # Local HTTPS demo only
      - "127.0.0.1:80:80"        # Local HTTP redirect only
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      pubmed-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # PubMed Search MCP Server
  # ==========================================================================
  pubmed-mcp:
    build: .
    expose:
      - "8765"  # Internal only, not exposed to host
    command:
      - uv
      - run
      - pubmed-search-mcp-http
      - --mode
      - local
      - --allow-container-bind
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
    environment:
      NCBI_EMAIL: ${NCBI_EMAIL:-pubmed-search@example.com}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      MCP_PORT: "8765"
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: streamable-http
      PUBMED_SERVER_MODE: local
      PUBMED_LOCAL_ALLOW_CONTAINER_BIND: "1"
      PUBMED_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*,pubmed-mcp,pubmed-mcp:*"
      PUBMED_ALLOWED_ORIGINS: https://localhost,http://localhost
      PUBMED_DATA_DIR: /var/lib/pubmed-search-mcp
    volumes:
      - pubmed-https-local-data:/var/lib/pubmed-search-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: pubmed-mcp-network

volumes:
  pubmed-https-local-data:
