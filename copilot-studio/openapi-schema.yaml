swagger: '2.0'
info:
  title: PubMed Search MCP
  description: |
    MCP endpoint wrapper for PubMed Search MCP.

    This schema is intended for Microsoft Copilot Studio / Power Apps custom
    connector onboarding. The real MCP tool discovery still happens through the
    `/mcp` endpoint at runtime.

    Recommended runtime modes:
    - Full schema mode: pubmed-search-mcp-http --mode service --transport streamable-http --copilot-compatible
    - Local-only simplified schema smoke: run_copilot.py (never publish or tunnel)
  version: 0.6.2
  contact:
    name: PubMed Search MCP
    url: https://github.com/u9401066/pubmed-search-mcp
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

host: your-server.example.com
basePath: /
schemes:
  - https

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: 'Service bearer credential in the form: Bearer <token>'

security:
  - BearerAuth: []

paths:
  /mcp:
    post:
      summary: PubMed Search MCP endpoint
      description: |
        Streamable HTTP MCP endpoint.

        The tool surface is discovered dynamically by the MCP client at runtime.
        This public endpoint must run the authenticated service profile and
        exposes the full primary MCP surface (45 tools in v0.6.2).
        The simplified run_copilot.py launcher is loopback-only and is not a
        valid deployment target for this bearer-authenticated connector.
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      consumes:
        - application/json
      produces:
        - application/json
      responses:
        '200':
          description: MCP response payload
          schema:
            type: object
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid bearer credential
        '403':
          description: Authenticated principal is not authorized for this resource
        '406':
          description: Unsupported MCP response content type
        '500':
          description: Server error

tags:
  - name: MCP
    description: Model Context Protocol endpoint
