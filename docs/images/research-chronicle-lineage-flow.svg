<svg xmlns="http://www.w3.org/2000/svg" width="880" height="398" viewBox="0 0 880 398" role="img" aria-labelledby="title desc">
  <title id="title">Publication time and the time a connection was recognized</title>
  <desc id="desc">Three dated sources on cochlear implants establish what the documents discussed. A later Chronicle revision can record a newly recognized connection without changing the publication dates.</desc>
  <style>
    text { font-family: "Segoe UI", sans-serif; fill: #192e33; }
    .heading { font: 600 29px Georgia, serif; }
    .label { font-size: 21px; font-weight: 650; }
    .body { font-size: 16px; }
    .note { font-size: 15px; fill: #39565b; }
    .paper { fill: #fff; stroke: #aac2bf; }
    .wash { fill: #e4f1ed; stroke: #8ab3a7; }
    .warm { fill: #fff2d9; stroke: #d4b575; }
    .line { fill: none; stroke: #557d77; stroke-width: 2; }
  </style>
  <rect width="880" height="398" fill="#f7faf9"/>
  <text x="30" y="43" class="heading">Reading a Chronicle across two kinds of time</text>
  <text x="30" y="75" class="note">Early cochlear implants · three historical sources in the worked case</text>
  <path d="M60 111 L810 111" class="line"/>
  <circle cx="56" cy="111" r="5" fill="#24594f"/>
  <circle cx="344" cy="111" r="5" fill="#24594f"/>
  <circle cx="634" cy="111" r="5" fill="#24594f"/>
  <rect x="30" y="134" width="254" height="92" rx="12" class="paper"/>
  <text x="45" y="160" class="note">1985</text>
  <text x="45" y="185" class="label">Device comparisons</text>
  <text x="45" y="208" class="body">PMID 3878092</text>
  <rect x="314" y="134" width="254" height="92" rx="12" class="paper"/>
  <text x="329" y="160" class="note">1986</text>
  <text x="329" y="185" class="label">Processing strategies</text>
  <text x="329" y="208" class="body">PMID 3753836</text>
  <rect x="598" y="134" width="254" height="92" rx="12" class="paper"/>
  <text x="613" y="160" class="note">1989</text>
  <text x="613" y="185" class="label">Consensus statement</text>
  <text x="613" y="208" class="body">PMID 2642379</text>
  <rect x="30" y="250" width="822" height="109" rx="12" class="wash"/>
  <text x="48" y="281" class="label">When the team recognized a connection</text>
  <text x="48" y="311" class="body">Compare two stored revisions to see which papers or relationships changed.</text>
  <text x="48" y="336" class="body">A link recognized later retains the original publication years and its supporting records.</text>
  <text x="30" y="383" class="note">Consult the original studies to decide whether a proposed fork describes the field.</text>
</svg>
