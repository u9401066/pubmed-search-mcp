<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
  <title id="title">PubMed concept comparison</title>
  <desc id="desc">In the 1980 to 1990 cochlear implant case, the ALL set contains 12 records. Removing B adds 10, removing C adds 190. The union contains 212 records.</desc>
  <style>
    text { font-family: "Segoe UI", sans-serif; fill: #192e33; }
    .heading { font: 600 29px Georgia, serif; }
    .label { font-size: 21px; font-weight: 650; }
    .body { font-size: 16px; }
    .note { font-size: 15px; fill: #39565b; }
    .paper { fill: #fff; stroke: #aac2bf; }
    .wash { fill: #e4f1ed; stroke: #8ab3a7; }
    .warm { fill: #fff2d9; stroke: #d4b575; }
    .line { fill: none; stroke: #557d77; stroke-width: 2; }
  </style>
  <rect width="880" height="390" fill="#f7faf9"/>
  <text x="30" y="43" class="heading">Which papers does a search condition exclude?</text>
  <text x="30" y="74" class="note">PubMed · Cochlear Implants [MeSH] · 1980–1990 · observed 20 November 2026</text>
  <text x="30" y="117" class="body">B   Speech Perception [MeSH]</text>
  <text x="448" y="117" class="body">C   Speech Intelligibility [MeSH]</text>
  <rect x="30" y="143" width="260" height="111" rx="12" class="paper"/>
  <text x="46" y="174" class="label">B only</text>
  <text x="46" y="207" class="label">190 records</text>
  <text x="46" y="234" class="note">Drop C to see these records.</text>
  <rect x="310" y="143" width="260" height="111" rx="12" class="wash"/>
  <text x="326" y="174" class="label">B and C</text>
  <text x="326" y="207" class="label">12 records</text>
  <text x="326" y="234" class="note">Original AND strategy.</text>
  <rect x="590" y="143" width="260" height="111" rx="12" class="paper"/>
  <text x="606" y="174" class="label">C only</text>
  <text x="606" y="207" class="label">10 records</text>
  <text x="606" y="234" class="note">Drop B to see these records.</text>
  <path d="M48 275 L832 275" class="line"/>
  <text x="30" y="307" class="label">Either concept  ·  190 + 12 + 10 = 212 records</text>
  <text x="30" y="342" class="body">A nominated reference in a difference moves it up the alert list. The agent can open sampled PMIDs.</text>
  <text x="30" y="366" class="note">These counts describe PubMed indexing on the observation date. Eligibility requires reading.</text>
</svg>
